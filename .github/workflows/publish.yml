# Publishes to PyPI with trusted publishing (OIDC) when a plain SemVer tag (e.g. 0.1.0) is pushed.
name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[abrc]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.13-slim

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The tag must match the package version, so a mistyped tag never publishes.
      - name: Check the tag matches the version
        run: |
          package_version="$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/simpledatalogs/_version.py").read()).group(1))')"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $package_version" >&2
            exit 1
          fi

      - run: pip install --root-user-action=ignore -e ".[test]" build

      - run: python -m pytest -q

      - run: python -m build

      # actions/upload-artifact v7.0.2, pinned by commit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    # Trusted publishing needs the OIDC token; nothing else is writable.
    permissions:
      id-token: write

    steps:
      # actions/download-artifact v8.0.2, pinned by commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish v1.14.2, pinned by commit; it also uploads attestations.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
